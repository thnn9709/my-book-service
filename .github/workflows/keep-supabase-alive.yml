name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PostgreSQL Database Directly
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql -h aws-0-eu-north-1.pooler.supabase.com \
               -p 5432 \
               -U postgres.omksbegroasgogeejkgw \
               -d postgres \
               -c "SELECT 1;"
